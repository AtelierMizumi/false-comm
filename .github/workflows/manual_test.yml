name: Manual Test Runner

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - widget
          - services
          - git_adapter
      verbose:
        description: 'Enable verbose output'
        required: false
        default: false
        type: boolean
      platform:
        description: 'Platform to run tests on'
        required: false
        default: 'ubuntu'
        type: choice
        options:
          - ubuntu
          - windows
          - macos

jobs:
  manual-test:
    name: Manual Test - ${{ inputs.test_type }} on ${{ inputs.platform }}
    runs-on: ${{ inputs.platform }}-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: inputs.platform == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run All Tests
        if: inputs.test_type == 'all'
        run: |
          echo "🧪 Running all tests..."
          flutter test ${{ inputs.verbose && '--reporter expanded' || '' }}

      - name: Run Unit Tests Only
        if: inputs.test_type == 'unit'
        run: |
          echo "🧪 Running unit tests..."
          flutter test test/services_test.dart ${{ inputs.verbose && '--reporter expanded' || '' }}

      - name: Run Widget Tests Only
        if: inputs.test_type == 'widget'
        run: |
          echo "🧪 Running widget tests..."
          flutter test test/widget_test.dart ${{ inputs.verbose && '--reporter expanded' || '' }}

      - name: Run Services Tests Only
        if: inputs.test_type == 'services'
        run: |
          echo "🧪 Running services tests..."
          flutter test test/services_test.dart ${{ inputs.verbose && '--reporter expanded' || '' }}

      - name: Run Git Adapter Tests Only
        if: inputs.test_type == 'git_adapter'
        run: |
          echo "🧪 Running git adapter tests..."
          flutter test test/git_adapter_test.dart ${{ inputs.verbose && '--reporter expanded' || '' }}

      - name: Generate Test Summary
        if: always()
        run: |
          echo "# 🧪 Manual Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Type:** ${{ inputs.test_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ inputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "**Verbose:** ${{ inputs.verbose }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
