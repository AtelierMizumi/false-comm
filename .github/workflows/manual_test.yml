name: 🧪 Manual Test

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Test file to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - services_test.dart
          - advanced_tests.dart
          - widget_test.dart
          - git_adapter_test.dart
      platform:
        description: 'Platform to test on'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      verbose:
        description: 'Verbose output'
        required: false
        default: false
        type: boolean
      coverage:
        description: 'Generate coverage report'
        required: false
        default: false
        type: boolean

jobs:
  manual-test:
    name: 🧪 ${{ inputs.test_file }} on ${{ inputs.platform }}
    runs-on: ${{ inputs.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          if [ "${{ inputs.test_file }}" == "all" ]; then
            flutter test ${{ inputs.coverage && '--coverage' || '' }} ${{ inputs.verbose && '--reporter expanded' || '' }}
          else
            flutter test test/${{ inputs.test_file }} ${{ inputs.coverage && '--coverage' || '' }} ${{ inputs.verbose && '--reporter expanded' || '' }}
          fi
        shell: bash

      - name: Upload coverage
        if: inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "# 🧪 Manual Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test file | \`${{ inputs.test_file }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | \`${{ inputs.platform }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Verbose | ${{ inputs.verbose }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ inputs.coverage }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
