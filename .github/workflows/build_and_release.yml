name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: ''
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean
      platforms:
        description: 'Platforms to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev patchelf

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Create portable Linux package
        run: |
          cd build/linux/x64/release/bundle
          
          # Create a launch script
          cat > fakecomm << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          cd "$SCRIPT_DIR"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/lib:$LD_LIBRARY_PATH"
          exec "$SCRIPT_DIR/fake_comm_gui" "$@"
          EOF
          
          chmod +x fakecomm
          
          cd ..
          tar -czf ../../../../FakeComm-Linux-x86_64-Portable.tar.gz -C bundle .
          
      - name: Create README for Linux
        run: |
          cat > LINUX_README.txt << 'EOF'
          FakeComm - Linux Portable Version
          ==================================
          
          Generate realistic fake Git commit histories!
          
          Installation:
          1. Extract: tar -xzf FakeComm-Linux-x86_64-Portable.tar.gz
          2. Run: ./fakecomm
          
          Or double-click 'fakecomm' in your file manager.
          
          Requirements:
          - GTK3
          - Git (for creating commits)
          
          Install on Ubuntu/Debian: sudo apt-get install libgtk-3-0 git
          Install on Fedora: sudo dnf install gtk3 git
          Install on Arch: sudo pacman -S gtk3 git
          EOF

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            FakeComm-Linux-x86_64-Portable.tar.gz
            LINUX_README.txt

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Rename executable for clarity
        run: |
          cd build\windows\x64\runner\Release
          
          # Rename the main executable to a user-friendly name
          if (Test-Path "fake_comm_gui.exe") {
            Rename-Item -Path "fake_comm_gui.exe" -NewName "FakeComm.exe"
            Write-Host "✅ Renamed to FakeComm.exe"
          }
          
          # Create README
          $readme = @'
          ╔══════════════════════════════════════════════╗
          ║   FakeComm - Windows Portable                ║
          ║   Generate Fake Git Commit Histories         ║
          ╚══════════════════════════════════════════════╝

          🚀 HOW TO RUN:
          
          Double-click: FakeComm.exe
          
          That's it!

          ─────────────────────────────────────────────

          📌 CREATE DESKTOP SHORTCUT:
          
          1. Right-click FakeComm.exe
          2. Select "Send to" → "Desktop (create shortcut)"
          3. Now you can run it from Desktop!

          ─────────────────────────────────────────────

          ℹ️  NOTES:
          
          - Keep all files in this folder together
          - Don't delete .dll files or data/ folder
          - You can copy the entire folder to another PC
          - Requires Git to be installed for creating commits

          ─────────────────────────────────────────────

          📦 Portable Version - No Installation Required
          '@
          
          Set-Content -Path "README.txt" -Value $readme -Encoding UTF8
          
          Write-Host "✅ Created README.txt"
        shell: pwsh

      - name: Compress Windows Build
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath FakeComm-Windows-Portable.zip -Force
          Write-Host "✅ Created portable ZIP package"
        shell: pwsh

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: FakeComm-Windows-Portable.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          
          # Create a simple zip for now
          zip -r ../../../../../FakeComm-macOS.zip fake_comm_gui.app
          
      - name: Create README for macOS
        run: |
          cat > MACOS_README.txt << 'EOF'
          FakeComm - macOS Version
          ========================
          
          Generate realistic fake Git commit histories!
          
          Installation:
          1. Extract FakeComm-macOS.zip
          2. Drag fake_comm_gui.app to Applications folder
          3. Right-click → Open (first time only, to bypass Gatekeeper)
          
          Requirements:
          - macOS 10.14 or later
          - Git (usually pre-installed on macOS)
          
          Note: On first launch, macOS may block the app. 
          Right-click and select "Open" to allow it.
          EOF

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            FakeComm-macOS.zip
            MACOS_README.txt

  create-release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
      
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FakeComm v1.0.${{ github.run_number }}
          body: |
            ## 🎭 FakeComm v1.0.${{ github.run_number }}
            
            **Generate realistic fake Git commit histories!**
            
            ### 📥 Download for your platform:
            
            | Platform | File | How to use |
            |----------|------|------------|
            | 🪟 **Windows** | `FakeComm-Windows-Portable.zip` | Extract → Run **FakeComm.exe** |
            | 🐧 **Linux** | `FakeComm-Linux-x86_64-Portable.tar.gz` | Extract → Run `./fakecomm` |
            | 🍎 **macOS** | `FakeComm-macOS.zip` | Extract → Open **fake_comm_gui.app** |
            
            ---
            
            ### 🪟 Windows
            
            1. Download `FakeComm-Windows-Portable.zip`
            2. Extract (Right-click → Extract All)
            3. Double-click `FakeComm.exe`
            
            **Create Desktop shortcut:**
            - Right-click `FakeComm.exe` → Send to → Desktop
            
            ---
            
            ### 🐧 Linux
            
            ```bash
            tar -xzf FakeComm-Linux-x86_64-Portable.tar.gz
            ./fakecomm
            ```
            
            **Dependencies:**
            ```bash
            # Ubuntu/Debian
            sudo apt-get install libgtk-3-0 git
            
            # Fedora
            sudo dnf install gtk3 git
            
            # Arch
            sudo pacman -S gtk3 git
            ```
            
            ---
            
            ### 🍎 macOS
            
            1. Download and extract `FakeComm-macOS.zip`
            2. Drag `fake_comm_gui.app` to Applications
            3. Right-click → Open (first time only)
            
            ---
            
            ### ✨ Features:
            
            - 🎯 5-step wizard: Repository → Identity → Behavior → Preview → Execute
            - 📊 Poisson/Normal sampling for realistic commit distribution
            - 🗓️ Holiday presets (Vietnam, USA, Japan, Korea, EU)
            - ⚖️ Weekday weights & monthly trends
            - 🕐 Intra-day time windows (work hours)
            - 📈 GitHub contribution history import
            - ↩️ Undo functionality with snapshots
            - 🔥 GitHub-style heatmap preview
            - 🎨 Material 3 design with light/dark theme
            
            ---
            
            ### ⚠️ Requirements:
            
            - **Git** must be installed on your system
            - The app creates commits in a local repository you specify
            
            ---
            
            **Built with:** Flutter 💙 | **License:** MIT
          draft: false
          prerelease: false
          files: |
            FakeComm-Linux-x86_64-Portable.tar.gz
            LINUX_README.txt
            FakeComm-Windows-Portable.zip
            FakeComm-macOS.zip
            MACOS_README.txt
