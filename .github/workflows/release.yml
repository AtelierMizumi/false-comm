name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest

  build-wheels:
    name: Build Python Wheels & Sdist
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build wheel and source tarball
        run: uv build

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-binary-linux:
    name: Build Standalone Linux Binary & .deb
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Generate completions
        run: ./packaging/scripts/generate_completions.sh

      - name: Build standalone binary
        run: ./packaging/scripts/build_binary.sh

      - name: Build Debian package
        run: ./packaging/scripts/build_deb.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/bin/false-comm-linux-*
            dist/*.deb

  build-binary-macos:
    name: Build Standalone macOS Binary
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build standalone binary
        run: ./packaging/scripts/build_binary.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/bin/false-comm-darwin-*

  build-binary-windows:
    name: Build Standalone Windows Binary
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build Windows binary
        shell: bash
        run: |
          uv run --with pyinstaller pyinstaller \
            --name false-comm-windows-x86_64.exe \
            --onefile \
            --clean \
            --add-data "src/false_comm/data;false_comm/data" \
            --distpath dist/bin \
            src/false_comm/cli/app.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/bin/*.exe

  publish-release:
    name: Create GitHub Release
    needs:
      - build-wheels
      - build-binary-linux
      - build-binary-macos
      - build-binary-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
