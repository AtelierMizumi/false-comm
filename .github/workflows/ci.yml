name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  # ============================================
  # QUICK CHECK - Runs on every push (fast feedback)
  # ============================================
  analyze:
    name: 🔍 Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .
        continue-on-error: true

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Check outdated packages
        run: flutter pub outdated
        continue-on-error: true

  # ============================================
  # TESTS - Run on multiple platforms
  # ============================================
  test:
    name: 🧪 Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run all tests
        run: flutter test --coverage

      - name: Upload coverage (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ============================================
  # BUILD CHECK - Verify builds work (dev branch)
  # ============================================
  build-check:
    name: 🔨 Build Check (${{ matrix.platform }})
    needs: [analyze, test]
    if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build-cmd: flutter build linux --release
          - os: windows-latest
            platform: windows
            build-cmd: flutter build windows --release
          - os: macos-latest
            platform: macos
            build-cmd: flutter build macos --release
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable desktop
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build
        run: ${{ matrix.build-cmd }}

      - name: Report build size
        shell: bash
        run: |
          echo "## 🔨 ${{ matrix.platform }} Build" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build successful!" >> $GITHUB_STEP_SUMMARY
          if [ "${{ matrix.platform }}" == "linux" ]; then
            SIZE=$(du -sh build/linux/x64/release/bundle | cut -f1)
            echo "📦 Size: **$SIZE**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ matrix.platform }}" == "windows" ]; then
            SIZE=$(du -sh build/windows/x64/runner/Release | cut -f1)
            echo "📦 Size: **$SIZE**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            SIZE=$(du -sh build/macos/Build/Products/Release/*.app | cut -f1)
            echo "📦 Size: **$SIZE**" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # SUMMARY
  # ============================================
  ci-success:
    name: ✅ CI Success
    needs: [analyze, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.analyze.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"

      - name: Summary
        run: |
          echo "# 🎉 CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Analyze | ${{ needs.analyze.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Tests | ${{ needs.test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
